# Erzeugt bei einem Versions-Tag (z. B. v1.0.0) ein GitHub Release mit
# thekenfuchs.zip (App zum Download / lokal unter Windows) und thekenfuchs.mobileconfig.
# Stabiler Download-Link: https://github.com/E-Fuchs/thekenfuchs/releases/latest/download/thekenfuchs.zip
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          npm ci
          pip install pillow playwright
          python -m playwright install --with-deps chromium
      - name: Bauen
        run: python build.py --version "${GITHUB_REF_NAME}"
      - name: Testen
        run: python test_e2e.py
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/release/thekenfuchs.zip \
            dist/release/thekenfuchs.mobileconfig \
            --title "Thekenfuchs ${GITHUB_REF_NAME#v}" \
            --generate-notes
